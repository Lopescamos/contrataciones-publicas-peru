[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contrataciones-publicas-peru"
version = "1.0.0"
description = "Pipeline de analítica de datos sobre las contrataciones públicas del Perú (estándar OCDS, OECE/SEACE)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kevin Edu Lopez Montalvo" }]
keywords = ["data-analytics", "ocds", "open-contracting", "peru", "seace", "power-bi", "etl"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: Spanish",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.2,<4",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "SQLAlchemy>=2.0,<3",
    "psycopg2-binary>=2.9",
    "requests>=2.31",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.25",
    "ruff>=0.6",
    "jupyterlab>=4",
    "ipykernel>=6",
    "matplotlib>=3.8",
    "nbformat>=5.9",
    "nbconvert>=7",
]

[project.scripts]
contrataciones = "contrataciones.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:openpyxl.*"]

[tool.coverage.run]
source = ["contrataciones"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["contrataciones"]
